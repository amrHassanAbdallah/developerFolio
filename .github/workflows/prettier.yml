name: Check Format
on:
  push:
  pull_request:
      branches:
        - master
jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v2-beta
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Check Format
        run: |
          npx prettier -c "./**/*.{js,css,json}"

